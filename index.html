<!DOCTYPE html>

<html>
  <head>
    <title>Cadastro de Usuário.projeto7</title>
  </head>

  <body>

    <header>
      <h1>Cadastro de Usuário</h1>

      <nav>
        <a href="#formulario">Formulário de Cadastro</a>
      </nav>
    </header>

    <section id="formulario">

      <h2>Formulário de Cadastro</h2>

      <form>

        <label>Nome Completo:</label>
        <input type="text">

        <br>

        <label>E-mail:</label>
        <input type="email">

        <br>

        <label>Senha:</label>
        <input type="password">

        <br>

        <label>Gênero:</label>

        <select>
          <option>Feminino</option>
          <option>Masculino</option>
          <option>Outro</option>
        </select>

        <br>

        <label>Interesses:</label>

        <input type="checkbox"> Programação
        <input type="checkbox"> Desenvolvimento Web
        <input type="checkbox"> Música

        <br>

        <label>Biografia:</label>

        <textarea></textarea>

        <br>

        <input type="submit" value="Enviar">

      </form>

    </section>

    <footer>
      <p>© 2026 Meu Site Pessoal.</p>
    </footer>

  </body>
</html>
